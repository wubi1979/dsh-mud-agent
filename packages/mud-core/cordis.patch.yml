# The dsh-mud-core bundle patch: the MUD core service row set (telnet client,
# perception/trigger pipeline, trigger-llm, and the agent bridge published as
# `ctx.mud`).
# UI shell (`@deepseek-ai/dsh-mud-webui`) is a separate row added after this
# one in a profile patch to pick the face.
#
# `name` points at the tsc build output (dist), so the row loads under plain
# Node ESM without any tsx involvement. Rebuild before boot:
#   pnpm --dir D:/Code/dsh-mud-agent -r build
#
# Deployment values live in the profile's own cordis.patch.yml (server,
# account, session pacing) — never in this bundle.

- insert:
    - id: mud-core
      name: 'file:///D:/Code/dsh-mud-agent/packages/mud-core/dist/index.js'
      config:
        host: mud.pkuxkx.net
        port: 8081
        sessionId: mud-player
        # 日志落盘目录 (JSONL, 按天轮转): 不设则默认 <host 进程 cwd>/mud-logs。
        logDir: 'D:/Code/dsh-mud-agent/logs'
        # 接入 agent: 注入游戏输出 → 判类注入 (规则命中 = T1 不耗 LLM;
        # 未命中 = T2 推理走 LLM provider)。关闭则连 T1 也不派发 (仅感知与终端)。
        agentEnabled: true
        commandIntervalMs: 400
        ruleDedupMs: 1500
        loginTimeoutMs: 20000
        persona: ''