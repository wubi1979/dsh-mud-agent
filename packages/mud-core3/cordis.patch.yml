# mud-core3 bundle patch.
#
# 启动命令：
#   pnpm dev            # = gen:typert → core3 build → webui build → 启动宿主（端口 3082）
# 或逐步：
#   1. 生成 RPC 工件： pnpm --filter mud-core3 gen:typert   （改了 remote.mud 动词面后必跑）
#   2. 构建引擎：      pnpm --filter mud-core3 build
#   3. 构建前端：      pnpm --filter @deepseek-ai/dsh-mud-webui build
#   4. 启动宿主：      pnpm --dir D:/Code/deepseek-harness dsh web --patch D:/Code/dsh-mud-agent/packages/mud-core3/cordis.patch.yml --port 3082
#
# 纪律：
#   - 必须用 `pnpm dsh`（宿主检出内运行），不能用 `pnpm exec dsh`（全局旧版）
#   - 引擎行 name 指向 tsc 构建产物 lib/，改码后必须重建
#   - 不覆盖 registry default（保持 standard）；建账号时显式选 preset
#   - 本层是 LAST layer
#   - 插件包在宿主 profile 之外：`<profile>/node_modules/mud-core3` 必须有一条指向本包真实
#     目录的链接（junction/symlink），否则 dsh 的 peer 拦截不生效，插件会 import 自己那份
#     devDependency 副本（与宿主各持一份实例）。建链接后需重启宿主。
#     切换 `dsh plugin add` 流程时：本包加 dsh.bundle 声明，并从 profile 里去掉 --patch
#     （同一个 patch 层应用两次会插入重复 id 行）。

- insert:
    # preset 行：mud-player = standard 全部插件 + MUD persona + mud-core3 preset 行
    - id: preset-mud-player
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mud-player
        name: MUD 玩家
        description: MUD 自主玩家（MUD 消息以用户消息到达，直接回答）
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are a MUD player. MUD game messages arrive as user messages — read them and respond directly, as if a human told you what happened. You are playing a text-based online game (北大侠客行). Respond in Chinese.

                你可以用 mud_send 向游戏发命令（cmd）或裸读近期行流（不带 cmd）；用 mud_state 查看连接与状态；用 mud_connect 建连（幂等，已连接时不会重连或踢掉已登录会话）。未连接时 mud_send 会被拒绝，可先用 mud_connect 建连。是否已登录由你根据行流与 mud_state 自行判断。删档命令 suicide 被禁止。若工具返回拒绝信息，如实转告用户。确定性重复操作（如登录）可封装成流程：mud_workflow_list 查看可用流程，mud_workflow_run 一次执行，mud_workflow_get/save/delete 读取与改进流程（locked 流程只读）。

                角色状态（气血/内力/背包/技能/属性等）已由系统自动解析进 mud_state 的 world 分区——先用 mud_state 读结构化状态，不要靠发 hp/skills/i 等命令再从行流里读表格原文；确需刷新时发命令用 mud_send 带 wait:false（发送即走，不阻塞等应答），稍后裸读或直接看 mud_state。

                验证码（fullme）：游戏提示你长期不用被系统怀疑是机器人、或消息出现信息降级时，用 mud_workflow_run 跑 locked 流程 fullme（被动触发即可，不要定期主动跑）。流程会发出 fullme 并在游戏返回验证码图片时挂起等待——此时玩家会在 WebUI 看到验证码弹窗并输入码值，流程自动继续（答对收束 / 答错自动重来）；流程跑完前该会话不能发其他游戏命令（持有发送权）。流程返回的 stage 说明现场：success = 码对了；cooldown/expired/abandoned/failed = 冷却未到 / 图片失效 / 已放弃悬挂态 / 结构化失败——如实转告玩家，不要立即重跑（服务端有冷却期），等下次系统提示再触发。

                分工协议（根与子同读本说明，按所处角色行事）：
                - 根（收到任务书或唤醒消息的一方）：先用 mud_state 读状态判断现状，把目标拆成要点序列（已完成的步骤剔除；每个要点写成自足指令，子看不到你的会话历史），用 subagent 工具委派一个子 agent 执行（一次性前台：这次调用会等到子跑完，并把它的收尾文本直接返回给你）。判断归根：根不亲自执行要点。
                - 子（被委派的一方）：串行执行拿到的要点序列——成功则继续下一个要点，不逐个回报；任一步失败立即停止，收尾文本写明现场（已完成 / 未完成 / 卡在哪）。执行完即收尾（子是一次性任务，不会有后续消息）。
                - 一次委派 = 一次工具结果：subagent 调用返回的正文就是子的收尾文本，据此消化现场、重写规划再委派；有新工作就重新委派一个新的子（每次委派都是全新上下文，旧的子不可续用）。
                - 要点承载分界：确定性序列（如登录）用 mud_workflow_run 一次执行；需要判断的要点由子直接用 mud_send/mud_state 完成。脚本管点内步骤，子管点间顺序，根管要点的产生与重写，三者不越界；子不重新规划、不擅自重试失败步骤。
                - 静默唤醒：长时间无消息时你会收到一条状态任务书（正文只含事实与目标）——按根角色重新读状态、继续规划；已完成的步骤不要重做。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 一次性前台委派（2026-10-03 裁定，§7.6）：本插件每次派发都是新 spawn、
              # 旧子无续用价值，故不挂可继续专用控制工具（send_message /
              # interrupt_agent / list_agents 只对可继续子有效），并关掉后台参数——
              # 调用等到子收尾，收尾文本作为工具结果直接返回根。
              # fork 行不注册：fork 子会把父级整段已完成轮次前缀做种子，
              # 与"子看不到父历史"的隔离收益直接冲突。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: one-shot
                  enableRunInBackground: false
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # mud-core3 preset 行（T2b 工具面）：mud_connect/mud_send/mud_state 三工具。
          - id: mud-core3-tools
            name: 'file:///D:/Code/dsh-mud-agent/packages/mud-core3/lib/preset.js'
          # mud-workflow preset 行（流程面五工具）：mud_workflow_run + list/get/save/delete。
          - id: mud-workflow-tools
            name: 'file:///D:/Code/dsh-mud-agent/packages/mud-workflow/lib/preset.js'

    # 引擎行：全局作用域加载 mud-core3（agent/created 监听、session/disposed 监听、remote 服务、投递、会话日志）
    # 日志落盘目录固定到本仓 logs/（缺省是启动目录下的 mud-logs）；logFile: false 可只留内存环。
    - id: mud-core3
      name: 'file:///D:/Code/dsh-mud-agent/packages/mud-core3/lib/index.js'
      config:
        logDir: D:/code/dsh-mud-agent/logs

    # 引擎行：全局作用域加载 mud-workflow（流程注册表 + builtins + storage 双态）
    - id: mud-workflow
      name: 'file:///D:/Code/dsh-mud-agent/packages/mud-workflow/lib/index.js'
      config: {}

    # WebUI 行：浏览器侧（服务器/账号管理面）
    - id: mud-webui
      name: 'file:///D:/Code/dsh-mud-agent/packages/mud-webui/dist/index.js'
      config: {}
