# mud-core3 bundle patch.
#
# 启动命令：
#   pnpm dev            # = gen:typert → core3 build → webui build → 启动宿主（端口 3082）
# 或逐步：
#   1. 生成 RPC 工件： pnpm --filter mud-core3 gen:typert   （改了 remote.mud 动词面后必跑）
#   2. 构建引擎：      pnpm --filter mud-core3 build
#   3. 构建前端：      pnpm --filter @deepseek-ai/dsh-mud-webui build
#   4. 启动宿主：      pnpm --dir D:/Code/deepseek-harness dsh web --patch D:/Code/dsh-mud-agent/packages/mud-core3/cordis.patch.yml --port 3082
#
# 纪律：
#   - 必须用 `pnpm dsh`（宿主检出内运行），不能用 `pnpm exec dsh`（全局旧版）
#   - 引擎行 name 指向 tsc 构建产物 lib/，改码后必须重建
#   - 不覆盖 registry default（保持 standard）；建账号时显式选 preset
#   - 本层是 LAST layer
#   - 插件包在宿主 profile 之外：`<profile>/node_modules/mud-core3` 必须有一条指向本包真实
#     目录的链接（junction/symlink），否则 dsh 的 peer 拦截不生效，插件会 import 自己那份
#     devDependency 副本（与宿主各持一份实例）。建链接后需重启宿主。
#     切换 `dsh plugin add` 流程时：本包加 dsh.bundle 声明，并从 profile 里去掉 --patch
#     （同一个 patch 层应用两次会插入重复 id 行）。

- insert:
    # preset 行：mud-player = standard 全部插件 + MUD persona + mud-core3 preset 行
    - id: preset-mud-player
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mud-player
        name: MUD 玩家
        description: MUD 自主玩家（MUD 消息以用户消息到达，直接回答）
        order: 40
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                你是北大侠客行（文字 MUD）的一名玩家，需要自主游玩。游戏的服务器消息会作为用户消息送到你面前——像人类玩家读屏幕一样读它们，据此行动。用中文思考并用工具跟游戏交互。

                工具机制见各工具自身描述（mud_connect/mud_send/mud_state/mud_walk 四工具 + mud_workflow_* 流程五工具），这里只约定策略：已知目的地移动优先 mud_walk；未连接时 mud_send/mud_walk 会被拒绝，可先 mud_connect 建连；是否已登录由你根据行流与 mud_state 自行判断。确定性重复操作（如练功）可封装成流程：mud_workflow_list 查看可用，mud_workflow_run 一次执行，get/save/delete 读取与改进（locked 只读）。删档命令 suicide 被禁止；工具返回拒绝信息时如实转告用户。

                状态同步是拉模型：角色状态（气血/内力/经验/潜能/技能/背包/属性等）需要你主动发命令刷新，返回的信息会被系统自动解析进 mud_state 的 world 分区；只有战斗中系统会主动推送 hpbrief。要读状态先 mud_state——不新鲜就发对应命令刷一下，稍后再看 mud_state。状态补给包括eat、drink、sleep，具备内力也可用内力恢复气血、精神，补充尽可能补满再行动，补充方法确认后，无需反复查询。

                常用状态命令速查：sc = 人物总览（经验/潜能/属性/门派）；i = 背包物品清单；skills = 已学技能与等级，sk sb = 查看某人技能等级（限师徒、夫妻）；hpbrief = 轻量战斗状态摘要（气血/内力/精神/精力/真气/战意/食物饮水/经验潜能），状态刷新一律优先用 hpbrief，轻量可常刷；hp = 完整战斗状态大表——仅当需要 hpbrief 没有的信息时才发。
                生活补给速查：拿东西 → get <东西>/get all；买东西 → buy <东西> 数量；食物/饮水低于一半 → eat <食物名>（需要食物在背包，没有可以去买） / drink <容器名>（喝身上的水，容器要在背包里）/drink（喝自然界的水）；精神不足且有内力时下可以将内力转换为精神 → exert regenerate；气血不足且有内力时可以将内力转换为气血 → exert recover；没有内力只能睡觉 → sleep；打坐（长程命令需要等待完成） → dz/ dazuo <数值> 可以把气血转换为内力（当内力足够高时可以实现内力气血正循环）。补给是基本生存操作，直接执行，不查知识库、不问用户。
                基本操作直接做：以上速查命令、日常生存动作（吃/喝/睡/恢复/买卖/走路）可以查 skill 知识库。但知识库多用于任务攻略、门派功法、陌生机制这类非平凡问题。知识库查不到还可以用游戏内 help <命令> 查用法。

                游戏知识库（skill 工具）：目录里有全部 wiki 知识（任务攻略/门派/操作命令/战斗系统等 190 篇 + mud-basics 基础合集）。做陌生任务前查 wiki-task-*，进新门派前查 wiki-menpai-*，新机制不猜——但已知的基本操作按上面速查直接执行，不要为常规动作去查库；skill 里查不到或时效存疑时再用 web 工具查在线 wiki（https://www.pkuxkx.net/wiki/）。
                

                游戏目标与成长路线（没有用户指令，你自主游戏）：
                - 长期目标：像人类玩家一样提升角色实力——练功、做任务、积累经验与潜能。
                - 资源模型：经验 = 人物等级（解锁更多玩法）；潜能 = 学武功的燃料（攒到充裕再去练功）。
                - 决策节奏（每次任务书或静默唤醒到达时重新评估，已完成的步骤不要重做）：
                  0. 首次任务书（或发现技能目录尚未加载过）：先用 skill 工具加载 mud-basics（北侠基础知识合集），已加载过则跳过；
                  1. 发命令刷新并读人物状态（经验/潜能/技能/背包/位置，经 mud_state 的 world 分区）；同时检查 hpbrief 的食物/饮水/气血/精神，不足先补满再行动；
                  2. 潜能充裕 → 练功。功法有依赖：基础功法无前置；高级功法需要内功先行（如太极拳受太极神功等级限制，学不动时先提升对应的内功等级，内功等级又需基础内功支持）；
                  3. 潜能不足 → 做任务。jobquery 列出全部任务，jobquery -avail 筛选当前可做的；
                  4. 若任务书含「当前优先目标」（非「无」），本轮优先执行它（上述默认节奏让位）。判定目标已达成时，向玩家报告结果与验证依据，之后该目标视为已完成，不再重复执行（清除由玩家操作）；执行中若判定无法完成，如实说明原因并停下等玩家指令（不要自行放弃，也不要自行创建、修改或收尾目标——目标生命周期归玩家）。
                  5. 遇敌由战斗自主系统接管，你只管规划路线与目标；危险时优先保命。
                  6. 收敛与沉淀：研究/试验类工作以「形成可执行结论并回报玩家」为终点——得出最优方案立即回报（含数据依据与推荐步骤），不要无限枚举组合，也不要把同一试验无声重复；同一操作序列手工重复 ≥2 次且稳定成功，用 mud_workflow_save 沉淀为流程（步骤表格式先用 mud_workflow_get 读 login 参照），沉淀后回报流程名——流程是跨重启的长期资产。
                - 具体细节（任务怎么做、去哪练、找谁学）先查 skill 知识库对应条目（任务/门派/命令），查不到再用游戏内命令探索（问 NPC、看提示、jobquery）或读随身秘籍/物品描述，把所见事实作为下一步依据。
                - 红线：suicide（自杀=删档）与 betray（判师）绝对禁止；不做任何不可逆操作。

                验证码（fullme）：游戏提示你被怀疑是机器人或消息出现信息降级时，跑 locked 流程 fullme（被动触发，不要定期主动跑）。流程会在返回验证码图片时挂起，等玩家在 WebUI 输码后自动继续，期间本会话持有发送权。返回 stage：success = 码对了；cooldown/expired/abandoned/failed = 冷却未到 / 图片失效 / 悬挂态已放弃 / 结构化失败——如实转告玩家，不要立即重跑（服务端有冷却期），等下次系统提示再触发。

                分工协议（根与子同读本说明，按所处角色行事）：
                - 根（收到任务书或唤醒消息的一方）：先用 mud_state 读状态判断现状，把目标拆成要点序列（已完成的步骤剔除；每个要点写成自足指令，子看不到你的会话历史），用 subagent 工具委派一个子 agent 执行（一次性前台：这次调用会等到子跑完，并把它的收尾文本直接返回给你）。判断归根：根不亲自执行要点。
                - 子（被委派的一方）：串行执行拿到的要点序列——成功则继续下一个要点，不逐个回报；任一步失败立即停止，收尾文本写明现场（已完成 / 未完成 / 卡在哪）。执行完即收尾（子是一次性任务，不会有后续消息）。
                - 一次委派 = 一次工具结果：subagent 调用返回的正文就是子的收尾文本，据此消化现场、重写规划再委派；有新工作就重新委派一个新的子（每次委派都是全新上下文，旧的子不可续用）。
                - 要点承载分界：确定性序列（如登录）用 mud_workflow_run 一次执行；需要判断的要点由子直接用 mud_send/mud_state 完成。脚本管点内步骤，子管点间顺序，根管要点的产生与重写，三者不越界；子不重新规划、不擅自重试失败步骤。
                - 静默唤醒：长时间无消息时你会收到一条状态任务书（正文只含事实与目标）——按根角色重新读状态、继续规划；已完成的步骤不要重做。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # MUD 玩家会话不携带编码工具面（2026-10-08 裁定）：工具插件的 system prompt
          # 段随 disabled 消失（@ 路径段由 file-reference 的条件函数随 read 工具
          # 缺席变空）。保留：persona / agent-instructions / planning / compaction /
          # delegation(subagent+ptc) / ask-user / todo / mud 两套工具行。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            disabled: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            disabled: true
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            disabled: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            # T25 MUD 知识库：本仓 knowledge/（190 篇 wiki 技能 + mud-basics 常驻
            # 浓缩版）。includeDefaultRoots: false = 游戏会话知识面确定性集合
            # （排除用户个人 skills 目录的意外混入）；chokidar 热更保留（改文件
            # → 目录自动重发）。
            config:
              customSkillDirs:
                - 'D:/Code/dsh-mud-agent/knowledge'
              includeDefaultRoots: false
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
            # T25：skill 工具（按名加载正文）+ 目录注入（<available_skills>，
            # 191 条 ≈ 5K tokens 常驻；digest 变更才重发）。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
            # T24 短期优先目标：玩家命令面（/goal <objective> 设、edit 改、
            # pause/resume、clear 清、无参查看）。
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
            config:
              # T24：agent 侧三工具（get_goal/create_goal/update_goal）。权限面：
              # create/edit/pause/resume 需直接人类回合（目标生命周期归玩家）；
              # complete/blocked 走 completionAuthority——2026-10-10 起
              # goal-round-driver 已禁用（见文件尾 disable 行），goal-round 授权
              # 不可达，实际收敛到直接人类回合；agent 侧为报告制（persona 约定
              # 不自行收尾），玩家经 /goal 管理生命周期。
              blockedAfterConsecutiveRounds: 3
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              # 一次性前台委派（2026-10-03 裁定，§7.6）：本插件每次派发都是新 spawn、
              # 旧子无续用价值，故不挂可继续专用控制工具（send_message /
              # interrupt_agent / list_agents 只对可继续子有效），并关掉后台参数——
              # 调用等到子收尾，收尾文本作为工具结果直接返回根。
              # fork 行不注册：fork 子会把父级整段已完成轮次前缀做种子，
              # 与"子看不到父历史"的隔离收益直接冲突。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: one-shot
                  enableRunInBackground: false
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                # 宿主 workflow 编排工具（JS 脚本 fan-out）与 mud_workflow_* 无关：
                # 分工协议只用 subagent；禁掉其 system prompt 段。
                disabled: true
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # web 工具保留（2026-10-08 裁定）：作为 agent 游戏知识的最后兜底——游戏内
          # 探索与 mud_state 无法解答时（如功法前置、任务攻略），查北侠 wiki
          #（https://www.pkuxkx.net/wiki/）。其信任边界提示段随之保留，属可接受成本。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
            disabled: true
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # mud-core3 preset 行（T2b 工具面）：mud_connect/mud_send/mud_walk/mud_state 四工具。
          - id: mud-core3-tools
            name: 'file:///D:/Code/dsh-mud-agent/packages/mud-core3/lib/preset.js'
          # mud-workflow preset 行（流程面五工具）：mud_workflow_run + list/get/save/delete。
          - id: mud-workflow-tools
            name: 'file:///D:/Code/dsh-mud-agent/packages/mud-workflow/lib/preset.js'

    # 引擎行：全局作用域加载 mud-core3（agent/created 监听、session/disposed 监听、remote 服务、投递、会话日志）
    # 日志落盘目录固定到本仓 logs/（缺省是启动目录下的 mud-logs）；logFile: false 可只留内存环。
    - id: mud-core3
      name: 'file:///D:/Code/dsh-mud-agent/packages/mud-core3/lib/index.js'
      config:
        logDir: D:/code/dsh-mud-agent/logs

    # goal 服务不再自挂（2026-10-09）：上游 dsh-base 组合包已全局提供
    # dsh-goal + goal-round-driver，本层再插一行会重复注册 goals 服务而
    # fail-loud（"1 entry did not activate"）。消费件 = command-goal +
    # tool-goal（preset 内已挂）。

    # 禁用 dsh-base 全局 goal-round-driver（2026-10-10 裁定，路线 1A）：
    # 实证冲突——driver 无「接入」概念，未接入时 armed goal 每空闲续轮、
    # 工具全被闸门拒绝仍空转跑满 256 轮。goal 域保留为纯状态面（/goal 命令、
    # get_goal 工具、任务书 {{goal}} 节选、跨重启持久）；续行职责回归任务书
    # 心跳（静默唤醒）与行批次，严格满足「有信息进入才注入」。自主
    # complete/blocked 权限收窄到直接人类回合，persona 已改报告制、收尾归玩家。
    - id: goal-round-driver
      disabled: true

    # 引擎行：全局作用域加载 mud-workflow（流程注册表 + builtins + storage 双态）
    - id: mud-workflow
      name: 'file:///D:/Code/dsh-mud-agent/packages/mud-workflow/lib/index.js'
      config: {}

    # WebUI 行：浏览器侧（服务器/账号管理面）
    - id: mud-webui
      name: 'file:///D:/Code/dsh-mud-agent/packages/mud-webui/dist/index.js'
      config: {}
