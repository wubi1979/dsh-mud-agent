#   $env:DSH_HOME='D:\code\_spike\smoke\dshhome'
#   $env:SMOKE_PHASE='1'
#   pnpm --dir D:/Code/deepseek-harness dsh web --patch D:/code/dsh-mud-agent/spike/smoke.patch.yml --port 3083 --no-open
